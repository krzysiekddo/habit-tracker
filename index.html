<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Habits</title>
  <meta name="description" content="Tygodniowy tracker nawyków">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Habits">
    <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/motion.css">
  <script>
    // motyw ustawiamy przed narysowaniem strony, żeby nie mignęła jasna wersja
    (function () {
      var t = null;
      try { t = localStorage.getItem("habits:theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
      var s = null;
      try { s = localStorage.getItem("habits:skin"); } catch (e) {}
      document.documentElement.dataset.skin = s || "gazeta";
      var g = null;
      try { g = localStorage.getItem("habits:glass"); } catch (e) {}
      if (g !== null && !isNaN(+g)) document.documentElement.style.setProperty("--glass-t", String(1 - (+g) / 100));
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="masthead" style="--i:0">
      <button class="skin-toggle" id="skin-toggle" type="button" aria-label="Wybierz motyw" data-i18n-aria="skinAria">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 1 0 0 19c1.3 0 2-.9 2-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.9 1.9-1.9h2.2a4.4 4.4 0 0 0 4.4-4.4C21.5 5.9 17.3 2.5 12 2.5Z"/><circle class="dot" cx="7.5" cy="11" r="1.4"/><circle class="dot" cx="10.5" cy="7" r="1.4"/><circle class="dot" cx="15.5" cy="7.5" r="1.4"/></svg>
      </button>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Switch to English">EN</button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Przełącz tryb ciemny">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
      <div class="issue-line">
        <span id="issue-kind" data-i18n="issueKind">Wydanie tygodniowe</span>
        <span id="issue-no">Nr —</span>
        <span id="issue-date">—</span>
      </div>
      <h1 class="nameplate">Habits</h1>
      <p class="deck" id="week-progress" aria-live="polite">&nbsp;</p>
    </header>

    <!-- Ekran logowania (tylko w trybie Firebase) -->
    <section id="auth" class="cover" hidden>
      <p class="cover-kicker" data-i18n="signInKicker">Habits</p>
      <h2 class="cover-title" data-i18n-html="signInTitle">Zaloguj się,<br><em>by zobaczyć swój tydzień.</em></h2>
      <button id="sign-in" class="btn btn-primary btn-lg" type="button" data-i18n="signInBtn">Zaloguj przez Google</button>
      <p id="auth-error" class="cover-error" role="alert"></p>
    </section>

    <main id="app" hidden>
      <nav class="weekbar" style="--i:1" aria-label="Nawigacja tygodnia" data-i18n-aria="weekNav">
        <button class="btn btn-icon" id="prev-week" type="button" aria-label="Poprzedni tydzień" data-i18n-aria="prevWeek">←</button>
        <div class="weekbar-title">
          <span class="weekbar-label" id="week-label">Ten tydzień</span>
          <h2 id="week-range">—</h2>
        </div>
        <button class="btn btn-icon" id="next-week" type="button" aria-label="Następny tydzień" data-i18n-aria="nextWeekAria">→</button>
        <button class="btn" id="today-btn" type="button" data-i18n="today">Dziś</button>
        <button class="btn btn-primary add-desktop" id="add-btn" type="button" data-i18n="add">+ Dodaj</button>
      </nav>

      <div class="strip" style="--i:2" id="strip" role="tablist" aria-label="Dni tygodnia" data-i18n-aria="stripAria"></div>

      <div class="week" id="week"></div>

      <section class="index" style="--i:10" aria-labelledby="index-title">
        <div class="index-head">
          <h2 id="index-title" data-i18n="indexTitle">Spis nawyków</h2>
          <button class="btn btn-sm" id="add-btn-2" type="button" data-i18n="add">+ Dodaj</button>
        </div>
        <ol class="index-list" id="index-list"></ol>
      </section>
    </main>

    <footer class="colophon">
      <span id="mode-note"></span>
      <button class="link" id="sign-out" type="button" hidden data-i18n="signOut">Wyloguj</button>
    </footer>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Dodaj nawyk" data-i18n-aria="fabAria" hidden>+</button>

  <dialog class="sheet" id="skin-dialog" aria-labelledby="skin-title">
    <div class="sheet-body">
      <header class="sheet-head">
        <p class="sheet-kicker" data-i18n="skinKicker">Wygląd</p>
        <h2 id="skin-title" data-i18n="skinTitle">Motyw</h2>
        <button class="btn btn-icon sheet-close" type="button" id="skin-close" aria-label="Zamknij" data-i18n-aria="close">✕</button>
      </header>
      <div class="skin-list" id="skin-list"></div>
      <label class="glass-ctl" id="glass-ctl" hidden>
        <span class="glass-ctl-head">
          <span class="field-label" data-i18n="glassLabel">Przezroczystość szkła</span>
          <span class="glass-ctl-val" id="glass-val">50%</span>
        </span>
        <input type="range" id="glass-range" min="0" max="100" step="1" value="50">
        <span class="glass-ctl-ends"><span data-i18n="glassTinted">Przyciemnione</span><span data-i18n="glassClear">Przejrzyste</span></span>
      </label>
    </div>
  </dialog>

  <dialog class="sheet" id="habit-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="habit-form" novalidate>
      <header class="sheet-head">
        <p class="sheet-kicker" id="dialog-kicker">Nowa rubryka</p>
        <h2 id="dialog-title">Nowy nawyk</h2>
        <button class="btn btn-icon sheet-close" type="button" id="dialog-close" aria-label="Zamknij" data-i18n-aria="close">✕</button>
      </header>

      <label class="field">
        <span class="field-label" data-i18n="name">Nazwa</span>
        <input id="habit-name" name="name" type="text" maxlength="60" autocomplete="off" placeholder="np. Poranny spacer" required>
      </label>

      <label class="oneoff">
        <input type="checkbox" id="oneoff-input">
        <span class="oneoff-box" aria-hidden="true"></span>
        <span class="oneoff-text" data-i18n="oneoff">Wydarzenie jednorazowe</span>
      </label>

      <label class="field" id="date-field" hidden>
        <span class="field-label" data-i18n="date">Data</span>
        <input id="event-date" name="date" type="date" required>
      </label>

      <fieldset class="field" id="days-field">
        <legend class="field-label" data-i18n="days">Dni</legend>
        <div class="days-picker" id="days-picker"></div>
        <div class="presets">
          <button type="button" class="chip" data-preset="1,2,3,4,5,6,7" data-i18n="everyDay">Codziennie</button>
          <button type="button" class="chip" data-preset="1,2,3,4,5" data-i18n="weekdays">Dni robocze</button>
          <button type="button" class="chip" data-preset="6,7" data-i18n="weekend">Weekend</button>
        </div>
      </fieldset>

      <p class="form-error" id="form-error" role="alert"></p>

      <footer class="sheet-actions">
        <button class="btn btn-danger" type="button" id="delete-btn" hidden>Usuń</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="cancel-btn" data-i18n="cancel">Anuluj</button>
        <button class="btn btn-primary" type="submit" id="save-btn" data-i18n="save">Zapisz</button>
      </footer>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
